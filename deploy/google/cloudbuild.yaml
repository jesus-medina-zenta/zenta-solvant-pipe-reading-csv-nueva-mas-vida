steps:
  # Paso 1: Instalar dependencias
  - name: 'python:3.9'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install --upgrade pip
        pip install -r requirements.txt

  # Paso 2: Ejecutar tests

  # Paso 3: Construir la imagen Docker
  - id: 'Build docker image'
    name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_DOCKER_REPOSITORY}/${_COMPONENT_NAME}:$BUILD_ID'
      - '.'

  # Paso 4: Push de la imagen a Container Registry
  - id: 'Push docker image'
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_DOCKER_REPOSITORY}/${_COMPONENT_NAME}:$BUILD_ID'

  # Paso 5: Desplegar a Cloud Run Jobs
  - id: 'Deploy to Cloud Run'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'jobs'
      - 'deploy'
      - '${_COMPONENT_NAME}-${_ENV}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_DOCKER_REPOSITORY}/${_COMPONENT_NAME}:$BUILD_ID'
      - '--region'
      - '${_REGION}'
      - '--service-account'
      - '${_RUN_SERVICE_ACCOUNT_EMAIL}'
      - '--set-env-vars=ENV=${_ENV}'
      - '--set-env-vars=PROJECT_ID=$PROJECT_ID'
      - '--set-env-vars=FIRESTORE_PROJECT_ID=$PROJECT_ID'
      - '--set-env-vars=FIRESTORE_COLLECTION=${_FIRESTORE_COLLECTION}'
      - '--set-env-vars=FIRESTORE_LOGS_COLLECTION=${_FIRESTORE_LOGS_COLLECTION}'
      - '--set-env-vars=FIRESTORE_BATCH_COLLECTION=${_FIRESTORE_BATCH_COLLECTION}'
      - '--set-env-vars=FIRESTORE_DATABASE=${_FIRESTORE_DATABASE}'
      - '--set-env-vars=GCS_BUCKET_NAME=${_GCS_BUCKET_NAME}'
      - '--set-env-vars=GCS_PROJECT_ID=$PROJECT_ID'
      - '--set-env-vars=BACKEND_SERVICE_URL=${_BACKEND_SERVICE_URL}'
      - '--set-env-vars=BACKEND_PAYLOAD_AGENT=${_BACKEND_PAYLOAD_AGENT}'
      - '--set-env-vars=BACKEND_PAYLOAD_CALLNAME=${_BACKEND_PAYLOAD_CALLNAME}'
      - '--set-env-vars=BACKEND_PAYLOAD_AGENT_PHONE_NUMBER_ID=${_BACKEND_PAYLOAD_AGENT_PHONE_NUMBER_ID}'
      - '--set-env-vars=BACKEND_ENDPOINT_BATCH_CALLING=${_BACKEND_ENDPOINT_BATCH_CALLING}'

# Configuraciones adicionales
options:
  logging: CLOUD_LOGGING_ONLY

# Timeout del build
timeout: '1200s'
